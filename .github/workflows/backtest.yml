name: Həftəlik backtest

# Hər bazar ertəsi 06:30 Bakı: sistem son 12 ayın oyunlarında yoxlanır, hesabat bazaya yazılır
# (/backtest əmri və veb panel onu göstərir). Qaydalar avtomatik dəyişdirilmir — kalibrləmə
# lokalda edilir: python -m backend.cli backtest --sweep [--apply]
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily  # the same database as the daily run: never at the same time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Asılılıqları quraşdır
        run: pip install -r requirements.txt

      - name: Tarixi CSV faylları (keş)
        uses: actions/cache@v4
        with:
          path: data/cache/football-data
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Bazanı bərpa et
        id: pull
        run: bash scripts/state.sh pull

      - name: Backtest
        run: python -m backend.cli backtest

      - name: Bazanı saxla
        if: always() && steps.pull.outcome == 'success'
        run: bash scripts/state.sh push

      - name: Veb paneli yarat
        run: python -m backend.cli dashboard --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
