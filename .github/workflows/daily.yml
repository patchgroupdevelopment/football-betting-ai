name: Gündəlik analiz

# 08:00 Bakı: yükləmə + nəticələrin hesablanması + analiz + Telegram mesajı.
# 15:00 Bakı: təzə əmsal və zədələrlə yeniləmə (səhər mesajı göndərilməyibsə, bu iş göndərir).
# Hər işdən sonra veb panel (GitHub Pages) yenilənir.
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Asılılıqları quraşdır
        run: pip install -r requirements.txt

      - name: Bazanı bərpa et
        id: pull
        run: bash scripts/state.sh pull

      - name: Yükləmə, nəticələr və analiz
        run: python -m backend.cli run-daily

      - name: Bazanı saxla
        if: always() && steps.pull.outcome == 'success'
        run: bash scripts/state.sh push

      - name: Veb paneli yarat
        run: python -m backend.cli dashboard --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
