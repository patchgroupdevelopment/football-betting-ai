# =============================================================
# Futbol Analiz Sistemi — dəyişdirilə bilən parametrlər
# Gizli açarlar burada YOX, .env faylında saxlanılır.
# .env-də eyni parametr (məs. MIN_ODDS) doldurulubsa, o üstündür.
# =============================================================

bankroll:
  starting: 2.0                       # başlanğıc balans (AZN)
  target: 10000.0                     # hədəf balans (AZN)
  mode: classic                       # classic | milestone_lock (qazanc kilidi)
  milestones: [50, 250, 1000, 5000]   # qazanc kilidi mərhələləri (AZN)
  lock_fraction: 0.5                  # mərhələ keçiləndə balansın kilidlənən payı
  projection_odds: 1.50               # piramida proqnozu üçün nümunə əmsal
  assumed_ev: 0.05                    # nəzəri ehtimal hesabı üçün fərziyyə (+5%)

selection:
  min_odds: 1.20
  max_odds: 1.70
  min_confidence: 75
  min_ev: 0.03                        # minimum dəyər üstünlüyü (EV)
  max_daily_picks: 3
  allow_combos: false                 # ekspress (kombinasiya) mərcləri
  watch_margin: 10                    # əminlik həddən bu qədər aşağıdırsa — "İZLƏMƏDƏ SAXLA"
  # Analiz olunan marketlər. Silinən market heç vaxt təklif olunmur.
  markets: [1X2, DC, DNB, OU, OU_1H, BTTS, TEAM_TOTAL_HOME, TEAM_TOTAL_AWAY, AH, CORNERS_OU, CARDS_OU]

# Əminlik səviyyəsinin çəkiləri — cəmi 1.00 olmalıdır
confidence_weights:
  form: 0.20                          # forma
  home_away: 0.15                     # ev/səfər
  xg: 0.15
  injuries: 0.15                      # zədə/cəza
  strength: 0.10                      # komandanın gücü
  h2h: 0.05                           # son qarşılaşmalar
  motivation: 0.10                    # motivasiya
  fatigue: 0.05                       # yorğunluq
  market: 0.05                        # bazar dəyəri

model:
  market_blend_weight: 0.4            # yekun ehtimalda modelin payı (qalanı bazar)
  llm_max_adjustment_pp: 4            # LLM-in ehtimalı dəyişə biləcəyi maksimum faiz bəndi
  elo_weight: 0.25                    # 1X2 tipli marketlərdə Elo-nun payı (qalanı Dixon-Coles)
  xg_weight: 0.6                      # komanda gücündə xG-nin payı (qalanı faktiki qollar)
  half_life_days: 180                 # köhnə oyunların çəkisinin yarıya düşmə müddəti
  prior_matches: 3                    # az məlumatlı komandanı orta səviyyəyə yaxınlaşdıran virtual oyunlar
  fit_window_days: 540                # model neçə günlük oyunlar üzərində qurulur
  max_contradiction_pp: 15            # model ilə bazar arasında icazə verilən maksimum fərq (f.b.)
  corners_dispersion: 1.25            # künclərin dağılması (1.0 = Poisson)
  cards_dispersion: 1.35              # kartların dağılması
  replacement_factor: 0.5             # itirilən oyunçunun töhfəsinin nə qədəri itir (qalanını əvəzedici verir)
  max_injury_attack_loss: 0.20        # zədələrə görə hücumun maksimum zəifləməsi
  max_injury_defence_gain: 0.15       # zədələrə görə buraxılan qolların maksimum artımı
  fatigue_penalty: 0.03               # qısa istirahətdə hücuma tətbiq olunan cərimə
  short_rest_days: 3                  # bu qədər və ya az istirahət "qısa" sayılır
  motivation_max_effect: 0.03         # motivasiyanın qol gözləntisinə maksimum təsiri
  version: dc-elo-v1                  # model versiyası (proqnozlarla birlikdə saxlanılır)

lineup_monitoring: true

ingestion:
  history_depth: 20                   # hər komanda üçün yüklənən son oyun sayı
  include_other_leagues: false        # siyahıda olmayan liqaları da ətraflı yüklə
  max_deep_matches: 60                # gündə ətraflı yüklənən maksimum oyun sayı

api_football:
  base_url: https://v3.football.api-sports.io
  requests_per_minute: 10             # Pulsuz plan: 10, Pro: 300
  daily_reserve: 5                    # gündəlik limitdən ehtiyatda saxlanan sorğu sayı
  timeout_seconds: 20
  max_retries: 3

cache_ttl_seconds:
  fixtures: 21600                     # 6 saat
  standings: 21600                    # 6 saat
  team_history: 43200                 # 12 saat
  injuries: 7200                      # 2 saat
  odds: 600                           # 10 dəqiqə
  lineups: 120                        # 2 dəqiqə
  h2h: 86400                          # 24 saat

schedule:
  daily_pipeline: "08:00"             # səhər yükləmə və hesabat
  second_run: "15:00"                 # axşam oyunları üçün yeniləmə
  cache_cleanup: "03:00"
  catch_up_on_start: true             # sistem gec işə düşsə, bugünkü yükləməni dərhal et

# Pulsuz tarixçə mənbələri (API-Football-un pulsuz planı keçmiş oyunları vermir)
external_data:
  enabled: true
  cache_hours: 12                     # CSV və cədvəllər bu müddətdə yenidən yüklənmir
  name_match_threshold: 0.84          # mənbələr arasında komanda adlarının uyğunluq həddi
  football_data_org:
    requests_per_minute: 10           # pulsuz planın limiti
  football_data_couk:
    seasons_back: 1                   # cari mövsümdən əlavə neçə keçmiş mövsüm yüklənsin

