    var datasets = ["model", "market", "final"].filter(function (k) { return cal[k] && cal[k].length; }).map(function (k) {
      return { label: L[k], data: cal[k].map(function (b) { return { x: b.predicted * 100, y: b.actual * 100 }; }), borderColor: palette[k], backgroundColor: palette[k], showLine: true, tension: .1 };
    });
    datasets.push({ label: "", data: [{ x: 50, y: 50 }, { x: 90, y: 90 }], borderColor: cssVar("--border"), borderDash: [4, 4], pointRadius: 0, showLine: true });
    chart(box.firstChild, { type: "scatter", data: { datasets: datasets }, options: { maintainAspectRatio: false,
      plugins: { legend: { labels: { filter: function (i) { return i.text; } } } },
      scales: { x: { title: { display: true, text: L.predicted + " %" }, min: 50, max: 90 }, y: { title: { display: true, text: L.actual + " %" }, min: 40, max: 100 } } } });
    return box;
  }
  function pyramidCard(key, v) {
    if (!v || !v.attempts) return el("div", { class: "card" }, el("h3", { text: L[key] }), el("div", { class: "note", text: "—" }));
    var best = v.max_attempt;
    var broke = (v.attempt_list || []).filter(function (a) { return a.number === best.number && a.broke_at; })[0];
    var net = v.locked_total ? v.locked_total - v.invested : -v.invested;
    return el("div", { class: "card" }, el("h3", { text: L[key] }),
      el("div", { class: "odds-line" }, el("b", { text: money(v.max_balance) }), " · " + best.wins + " " + L.wins_in_row),
      el("div", { class: "stats" },
        el("div", null, el("span", { text: L.attempts }), el("strong", { text: String(v.attempts) })),
        el("div", null, el("span", { text: L.invested }), el("strong", { text: money(v.invested) })),
        el("div", null, el("span", { text: L.net }), el("strong", { class: cls(net), text: signed(net) + " " + L.azn }))),
      v.locked_total ? el("div", { class: "note", text: L.locked + ": " + money(v.locked_total) }) : el("div", { class: "note", text: L.lost_all }),
      broke ? el("div", { class: "note", text: L.broke_on + ": " + broke.broke_at.home + " – " + broke.broke_at.away + " " + broke.broke_at.score + " · " + broke.broke_at.pick + " (" + num(broke.broke_at.odds) + ") · " + money(broke.broke_at.balance_before) }) : null);
  }
  function renderBacktest(root) {
    var b = D.backtest;
    root.appendChild(el("h2", { text: L.backtest_title }));
    if (!b) { root.appendChild(el("div", { class: "notice", text: L.backtest_missing })); return; }
    var pr = b.params;
    root.appendChild(el("div", { class: "card" },
      el("div", null, el("strong", { text: L.period + ": " }), b.period.start + " – " + b.period.end + " · " + b.matches + " " + L.matches.toLowerCase() + " · " + b.leagues.length + " " + L.league.toLowerCase()),
      el("div", null, el("strong", { text: L.rules + ": " }), L.model_weight + " " + frac(pr.model_weight) + " · " + L.min_ev + " " + frac(pr.min_ev) + " · " + L.min_confidence + " " + pr.min_confidence)));
    root.appendChild(el("div", { style: "height:12px" }));
    root.appendChild(summaryKpis(b.summary, b.median_price, b.baseline));
    if (b.equity && b.equity.length > 1) { root.appendChild(el("h2", { text: L.equity })); root.appendChild(lineChart(b.equity, L.profit)); }

    root.appendChild(el("h2", { text: L.pyramid_sim }));
    var keys = ["daily_classic", "daily_milestone_lock", "chain_classic", "chain_milestone_lock"];
    root.appendChild(el("div", { class: "grid cards" }, keys.map(function (k) { return pyramidCard(k, (b.pyramid || {})[k]); })));
    var main = (b.pyramid || {}).daily_classic;
    if (main && main.attempts) {
      var hist = main.break_histogram || {};
      var hbox = el("div", { class: "card" }, el("h3", { text: L.break_histogram + " · " + L.daily_classic }), el("div", { class: "chart-box" }));
      chart(hbox.lastChild, { type: "bar", data: { labels: Object.keys(hist), datasets: [{ data: Object.values(hist), backgroundColor: cssVar("--bad") }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { precision: 0 } } } } });
      root.appendChild(el("div", { style: "height:12px" }));
      root.appendChild(hbox);
      root.appendChild(el("h2", { text: L.best_path }));
      root.appendChild(table([
        { label: L.date, key: "day" }, { label: L.match, render: function (s) { return s.home + " – " + s.away; } },
        { label: L.score, key: "score" }, { label: L.pick, key: "pick" },
        { label: L.odds, num: true, render: function (s) { return num(s.odds); } },
        { label: L.before, num: true, render: function (s) { return money(s.balance_before); } },
        { label: L.after, num: true, render: function (s) { return money(s.balance_after); }, cls: function (s) { return s.balance_after > 0 ? "" : "neg"; } }
      ], main.max_attempt.path));
    }

    root.appendChild(el("h2", { text: L.calibration }));
    root.appendChild(calibrationChart(b.calibration || {}));
    var scores = b.probability_scores || {};
    root.appendChild(el("div", { style: "height:12px" }));
    root.appendChild(table([{ label: L.brier, key: "name" }, { label: "Brier", num: true, key: "brier" }, { label: "Log loss", num: true, key: "log_loss" }, { label: L.matches, num: true, key: "matches" }],
      ["model", "market", "final", "closing"].filter(function (k) { return scores[k]; }).map(function (k) { return Object.assign({ name: L[k] }, scores[k]); })));

    var groups = [["by_market", b.market_names], ["by_league"], ["by_confidence"], ["by_odds"], ["by_bookmaker"], ["by_month"]];
    root.appendChild(el("h2", { text: L.group }));
    var seg = el("div", { class: "seg" });
    var holder = el("div");
    groups.forEach(function (g, i) {
      var btn = el("button", { type: "button", "aria-pressed": i === 0 ? "true" : "false", text: L[g[0]] });
      btn.addEventListener("click", function () {
        Array.prototype.forEach.call(seg.children, function (x) { x.setAttribute("aria-pressed", "false"); });
        btn.setAttribute("aria-pressed", "true");
        holder.replaceChildren(groupTable(b[g[0]], g[1]));
      });
      seg.appendChild(btn);
    });
    holder.appendChild(groupTable(b.by_market, b.market_names));
    root.appendChild(seg); root.appendChild(holder);

    if (b.sweep) {
      root.appendChild(el("h2", { text: L.sweep }));
      root.appendChild(table([
        { label: L.model_weight, num: true, render: function (r) { return frac(r.model_weight); } },
        { label: L.min_ev, num: true, render: function (r) { return frac(r.min_ev); } },
        { label: L.min_confidence, num: true, key: "min_confidence" },
        { label: L.bets, num: true, key: "bets" },
        { label: L.roi, num: true, render: function (r) { return frac(r.roi, true); }, cls: function (r) { return cls(r.roi); } },
        { label: L.first_half, num: true, render: function (r) { return frac(r.first_roi, true); } },
        { label: L.second_half, num: true, render: function (r) { return frac(r.second_roi, true); } },
        { label: L.clv, num: true, render: function (r) { return frac(r.avg_clv, true); } },
        { label: L.robust, render: function (r) { return r.robust ? chip("bet", "✓") : chip("void", "—"); } }
      ], b.sweep.rows));
    }
    root.appendChild(el("h2", { text: L.bets }));
    root.appendChild(table([
      { label: L.date, key: "day" }, { label: L.league, key: "league" },
      { label: L.match, render: function (x) { return x.home + " – " + x.away; } }, { label: L.score, key: "score" },
      { label: L.pick, key: "pick" }, { label: L.odds, num: true, render: function (x) { return num(x.odds); } },
      { label: L.bookmaker, key: "bookmaker" },
      { label: L.status, render: function (x) { var s = x.outcome === "win" ? "won" : x.outcome === "loss" ? "lost" : "void"; return chip(s, L[s]); } },
      { label: L.clv, num: true, render: function (x) { return frac(x.clv, true); } }
    ], (b.bets || []).slice().reverse()));
    root.appendChild(el("h2", { text: L.notes }));
    root.appendChild(el("div", { class: "card" }, el("ul", { class: "reasons" }, (b.notes || []).map(function (n) { return el("li", { text: L["note_" + n] || n }); }))));
  }

  // ------------------------------------------------------------- system
  function renderSystem(root) {
    var s = D.system;
    root.appendChild(el("h2", { text: L.system_runs }));
    root.appendChild(table([{ label: L.group, render: function (r) { return L["kind_" + r.kind] || r.kind; } }, { label: L.status, key: "status" }, { label: L.date, key: "when" }], s.runs));
    root.appendChild(el("div", { style: "height:12px" }));
    root.appendChild(el("div", { class: "grid kpis" }, kpi(L.db_matches, s.matches.toLocaleString("en-US")), kpi(L.db_teams, s.teams.toLocaleString("en-US")), kpi(L.db_odds, s.odds.toLocaleString("en-US"))));
  }

  // ------------------------------------------------------------- shell
  var TABS = [["today", L.tab_today, renderToday], ["results", L.tab_results, renderResults], ["pyramid", L.tab_pyramid, renderPyramid], ["backtest", L.tab_backtest, renderBacktest], ["system", L.tab_system, renderSystem]];
  document.title = L.title;
  document.getElementById("title").textContent = L.title;
  document.getElementById("subtitle").textContent = L.subtitle;
  document.getElementById("generated").textContent = L.generated + ": " + D.generated;
  if (D.paper_mode) { var badge = document.getElementById("paper"); badge.hidden = false; badge.textContent = L.paper; }
  document.getElementById("footer").textContent = L.disclaimer;
  var nav = document.getElementById("tabs"), main = document.getElementById("main");
  var sections = {};
  TABS.forEach(function (tab) {
    var btn = el("button", { role: "tab", type: "button", "aria-selected": "false", "data-tab": tab[0], text: tab[1] });
    btn.addEventListener("click", function () { show(tab[0]); });
    nav.appendChild(btn);
    var section = el("section", { id: "tab-" + tab[0], hidden: "hidden" });
    main.appendChild(section);
    sections[tab[0]] = { section: section, render: tab[2], done: false };
  });
  function show(name) {
    if (!sections[name]) name = "today";
    Object.keys(sections).forEach(function (k) { sections[k].section.hidden = k !== name; });
    Array.prototype.forEach.call(nav.children, function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === name ? "true" : "false"); });
    var s = sections[name];
    if (!s.done) { s.render(s.section); s.done = true; }
    try { localStorage.setItem("tab", name); } catch (e) { /* storage unavailable */ }
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  }
  var initial = location.hash.slice(1);
  if (!initial) { try { initial = localStorage.getItem("tab") || ""; } catch (e) { initial = ""; } }
  show(initial || "today");
})();
